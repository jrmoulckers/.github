name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Thank you for reporting a bug. Please provide enough detail so maintainers or contributors can reproduce and fix it.

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: What is broken?
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide numbered steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the problem
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: Describe the expected outcome.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe the actual outcome.
    validations:
      required: true

  - type: input
    id: area-component
    attributes:
      label: Area / Component
      description: Which area, package, feature, page, workflow, or component appears affected?
      placeholder: e.g. authentication, docs, API, UI, build, tests
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - 'Critical (data loss/security/user-blocking)'
        - 'High (major feature broken)'
        - 'Medium (degraded experience)'
        - 'Low (cosmetic/minor)'
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment, if relevant.
      placeholder: |
        - OS:
        - Browser / runtime:
        - App or package version:
        - Device or hosting context:
    validations:
      required: false

  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots / Logs
      description: Attach screenshots or paste relevant log output. Redact secrets and private data.
      placeholder: Drag and drop images or paste log output here.
    validations:
      required: false

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      description: Please confirm before submitting.
      options:
        - label: I have searched for existing issues
        - label: I can reproduce this consistently or have explained why reproduction is intermittent
