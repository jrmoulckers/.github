# =============================================================================
# Reusable — Lint
# =============================================================================
#
# Framework-agnostic lint/format workflow for product repositories. Callers choose
# Node.js, npm or pnpm, working directory, and exact lint/format commands.
#
# Example caller:
#   jobs:
#     lint:
#       uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@main
#       with:
#         package-manager: pnpm
#         lint-command: pnpm lint
#         format-check-command: pnpm format:check
# =============================================================================
name: Reusable — Lint

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Directory containing the package manifest and lockfile.
        required: false
        type: string
        default: .
      lint-command:
        description: Command that runs lint checks.
        required: false
        type: string
        default: npm run lint
      format-check-command:
        description: Command that checks formatting.
        required: false
        type: string
        default: npm run format:check
      semantic-pr-title:
        description: Validate pull request titles against Conventional Commits.
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package manager
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be 'npm' or 'pnpm'"
              exit 1
              ;;
          esac

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.lint-command }}

      - name: Check formatting
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.format-check-command }}

  pr-title:
    name: Semantic PR Title
    if: inputs.semantic-pr-title && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false
