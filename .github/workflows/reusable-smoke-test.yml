# =============================================================================
# Reusable — Smoke Test
# =============================================================================
#
# Generic web smoke test workflow. It builds, tests, optionally checks an HTTP
# URL, and exposes a pass/fail output for release or deployment workflows.
#
# Example caller:
#   jobs:
#     smoke:
#       uses: jrmoulckers/.github/.github/workflows/reusable-smoke-test.yml@main
#       with:
#         version: 1.2.3
#         package-manager: pnpm
#         base-url: https://example.com/health
# =============================================================================
name: Reusable — Smoke Test

on:
  workflow_call:
    inputs:
      version:
        description: Version being smoke tested.
        required: true
        type: string
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Directory containing the package manifest and lockfile.
        required: false
        type: string
        default: .
      build-command:
        description: Command that builds the web app.
        required: false
        type: string
        default: npm run build
      test-command:
        description: Command that runs tests.
        required: false
        type: string
        default: npm test
      base-url:
        description: Optional URL for an HTTP smoke check.
        required: false
        type: string
        default: ''
    outputs:
      result:
        description: Overall smoke test result (pass/fail).
        value: ${{ jobs.summary.outputs.result }}

permissions:
  contents: read

jobs:
  web:
    name: Web Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package manager
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be 'npm' or 'pnpm'"
              exit 1
              ;;
          esac

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: HTTP smoke check
        if: inputs.base-url != ''
        run: curl --fail --silent --show-error --location --max-time 30 "${{ inputs.base-url }}" > /dev/null

  summary:
    name: Smoke Test Summary
    needs: web
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      result: ${{ steps.result.outputs.result }}

    steps:
      - name: Evaluate smoke result
        id: result
        run: |
          WEB_RESULT="${{ needs.web.result }}"

          echo "### 🧪 Smoke Test Results — v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web | ${WEB_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$WEB_RESULT" = "success" ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**✅ Smoke test passed.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**❌ Smoke test failed.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
