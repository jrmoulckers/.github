# =============================================================================
# Reusable — Deploy Preview
# =============================================================================
#
# Provider-neutral pull request preview workflow for product repositories. The
# safe default uploads the build output as an artifact; custom providers can run
# a caller-supplied deploy command with DEPLOY_TOKEN available.
#
# Example caller:
#   jobs:
#     preview:
#       uses: jrmoulckers/.github/.github/workflows/reusable-deploy-preview.yml@main
#       with:
#         package-manager: pnpm
#         build-command: pnpm build
#         output-dir: dist
# =============================================================================
name: Reusable — Deploy Preview

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Directory containing the package manifest and lockfile.
        required: false
        type: string
        default: .
      build-command:
        description: Command that builds the preview artifact.
        required: false
        type: string
        default: npm run build
      output-dir:
        description: Build output directory, relative to working-directory.
        required: false
        type: string
        default: dist
      provider:
        description: Preview provider (artifact or custom).
        required: false
        type: string
        default: artifact
      preview-command:
        description: Custom preview deployment command, run when provider is custom.
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_TOKEN:
        description: Optional token for custom preview deployment providers.
        required: false
    outputs:
      preview-url:
        description: Preview URL from the custom provider, or blank for artifact previews.
        value: ${{ jobs.deploy.outputs.preview-url }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview-url: ${{ steps.custom.outputs.preview-url || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate inputs
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be 'npm' or 'pnpm'"
              exit 1
              ;;
          esac

          case "${{ inputs.provider }}" in
            artifact|custom) ;;
            *)
              echo "::error::provider must be 'artifact' or 'custom'"
              exit 1
              ;;
          esac

          if [ "${{ inputs.provider }}" = "custom" ] && [ -z "${{ inputs.preview-command }}" ]; then
            echo "::error::preview-command is required when provider is 'custom'"
            exit 1
          fi

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Upload preview artifact
        if: inputs.provider == 'artifact'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-build-${{ github.run_id }}
          path: ${{ inputs.working-directory }}/${{ inputs.output-dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Run custom preview deploy
        id: custom
        if: inputs.provider == 'custom'
        working-directory: ${{ inputs.working-directory }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: ${{ inputs.preview-command }}

      - name: Preview summary
        if: always()
        run: |
          echo "### 🚀 Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Provider | ${{ inputs.provider }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output | \`${{ inputs.working-directory }}/${{ inputs.output-dir }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Preview URL | ${{ steps.custom.outputs.preview-url || 'N/A' }} |" >> "$GITHUB_STEP_SUMMARY"
