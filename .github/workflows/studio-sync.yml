# =============================================================================
# Studio sync — distribute the canonical AI layer to member repos
# =============================================================================
#
# Runs the sync engine (`sync/index.mjs`) on a weekly schedule and on demand. For each
# member repo in `studio.config.json` it opens a `chore(sync)` PR with the opted-in canon
# (agents, skills, prompts, instructions, AGENTS.md base block, agency.toml), vendors the built
# `@jrm/tokens` outputs into members that opt in, and mirrors the profile README to
# `jrmoulckers/jrmoulckers`.
#
# IMPORTANT — authentication:
#   The default `GITHUB_TOKEN` is scoped to THIS repo only; it CANNOT push branches or open
#   PRs in other repositories. Cross-repo sync therefore requires a Personal Access Token
#   stored as the `STUDIO_SYNC_TOKEN` secret. Use a FINE-GRAINED token with exactly:
#     - Contents: Read and write      — every repo in studio.config.json `members` + `jrmoulckers/jrmoulckers`
#     - Pull requests: Read and write — same destinations
#   Enumerate that list at grant time; do not rely on a count recorded here. A member present in
#   the manifest but absent from the PAT 403s on clone, and only that member fails (see #176).
#   `jrmoulckers/studio` is both a member and the private @jrm/tokens source, so its
#   Contents: Read and write grant already includes the read needed for vendoring.
#   Do NOT grant the classic `workflow` scope. The engine never writes under
#   `.github/workflows/` — `workflows` and `health` are NATIVE kinds, resolved and reported
#   but never copied (see docs/sync.md). A classic `repo` PAT also works but is far broader
#   than needed. If a run ever 403s on a `.github/workflows/` path that is a bug in the
#   native-kind handling, not a missing scope.
#
# Without that secret the job fails fast on real syncs; `dry_run` needs no token.
# =============================================================================
name: Studio sync

on:
  schedule:
    # Weekly, Mondays 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      members:
        description: 'Comma-separated member filter (owner/name or bare name). Blank = all.'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Plan only — no writes, git, or network.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Overwrite drifted targets in the named members. Requires a members filter.'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: studio-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync canon to member repos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout backbone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Preflight — require token for real syncs
        if: ${{ inputs.dry_run != true }}
        env:
          STUDIO_SYNC_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
        run: |
          if [ -z "$STUDIO_SYNC_TOKEN" ]; then
            echo "::error::STUDIO_SYNC_TOKEN is required. Grant Contents + Pull requests: Read and write on every repo listed in studio.config.json \"members\" (not a remembered count) and jrmoulckers/jrmoulckers. Studio is both a member and the token source, so no separate read-only grant is needed. Do not grant workflow scope."
            exit 1
          fi

      - name: Preflight — a forced run must name its members
        if: ${{ inputs.force == true && inputs.members == '' }}
        run: |
          echo "::error::force requires a members filter. A forced run overrides drift protection, which is what keeps the engine from overwriting member-authored content; an unscoped one would do that across the whole fleet. Re-dispatch with members set. The engine enforces this too — this check only fails before a runner does the work."
          exit 1

      - name: Run studio sync
        env:
          STUDIO_SYNC_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MEMBERS: ${{ inputs.members }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=("--dry-run"); fi
          if [ -n "$MEMBERS" ]; then args+=("--members" "$MEMBERS"); fi
          if [ "$FORCE" = "true" ]; then args+=("--force"); fi
          echo "Running: node sync/index.mjs ${args[*]}"
          node sync/index.mjs "${args[@]}"
