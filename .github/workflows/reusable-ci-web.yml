# =============================================================================
# Reusable — Web CI
# =============================================================================
#
# Framework-agnostic web CI for product repositories. Callers choose Node.js, npm
# or pnpm, working directory, install/typecheck/test/build commands, and optional
# build-time environment as JSON.
#
# Example caller:
#   jobs:
#     web-ci:
#       uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@main
#       with:
#         package-manager: pnpm
#         typecheck-command: pnpm typecheck
#         test-command: pnpm test
#         build-command: pnpm build
# =============================================================================
name: Reusable — Web CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Directory containing the package manifest and lockfile.
        required: false
        type: string
        default: .
      install-command:
        description: Optional custom dependency install command.
        required: false
        type: string
        default: ''
      typecheck-command:
        description: Command that runs type checking; skipped when empty.
        required: false
        type: string
        default: npm run typecheck
      test-command:
        description: Command that runs tests; skipped when empty.
        required: false
        type: string
        default: npm test
      build-command:
        description: Command that builds the web app; skipped when empty.
        required: false
        type: string
        default: npm run build
      build-env-json:
        description: JSON object of additional environment variables for the build step.
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package manager
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be 'npm' or 'pnpm'"
              exit 1
              ;;
          esac

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (custom)
        if: inputs.install-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Install dependencies (npm)
        if: inputs.install-command == '' && inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.install-command == '' && inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: inputs.typecheck-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.typecheck-command }}

      - name: Test
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Build
        if: inputs.build-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env-json }}
        run: |
          if [ -n "$BUILD_ENV_JSON" ] && [ "$BUILD_ENV_JSON" != "{}" ]; then
            echo "$BUILD_ENV_JSON" | jq -e 'type == "object"' > /dev/null
            while IFS='=' read -r key value; do
              export "$key=$value"
            done < <(echo "$BUILD_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value | tostring)"')
          fi

          ${{ inputs.build-command }}
