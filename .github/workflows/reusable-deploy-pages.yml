# =============================================================================
# Reusable - Deploy GitHub Pages
# =============================================================================
#
# The build job has contents read only. The deploy job receives only Pages and
# OIDC write authority, consumes the fixed github-pages artifact, runs no caller
# code, and is gated by the repository's github-pages environment.
#
# Optional private registry: set registry-url and registry-scope and pass the NODE_AUTH_TOKEN
# secret to install scoped packages from a private registry. actions/setup-node then writes a
# user-level npmrc to $RUNNER_TEMP/.npmrc and exports NPM_CONFIG_USERCONFIG; npm and pnpm both
# honour that file. A caller's own committed .npmrc is project-level and outranks it on every
# key it sets, so a repo .npmrc must not point the same scope at a different registry.
#
# The build job requests packages: read. A caller with an explicit permissions block must grant
# packages: read too, or the run fails at startup.
#
# Example caller:
#   permissions:
#     contents: read
#     packages: read
#     pages: write
#     id-token: write
#   jobs:
#     pages:
#       uses: jrmoulckers/.github/.github/workflows/reusable-deploy-pages.yml@<reviewed-commit-sha>
#       with:
#         package-manager: pnpm
#         build-command: pnpm build
#         registry-url: https://npm.pkg.github.com
#         registry-scope: '@jrmoulckers'
#       secrets:
#         NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# =============================================================================
name: Reusable - Deploy GitHub Pages

on:
  workflow_call:
    inputs:
      node-version:
        description: Numeric Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Workspace-relative package directory.
        required: false
        type: string
        default: .
      build-command:
        description: Trusted repository command that builds the production site.
        required: false
        type: string
        default: npm run build
      output-dir:
        description: Non-root production output path below working-directory.
        required: false
        type: string
        default: dist
      registry-url:
        description: Optional HTTPS private registry to authenticate against; empty disables registry auth.
        required: false
        type: string
        default: ''
      registry-scope:
        description: Lowercase npm scope the private registry serves, such as @jrmoulckers.
        required: false
        type: string
        default: ''
    secrets:
      NODE_AUTH_TOKEN:
        description: Token used to authenticate against registry-url; unused when registry-url is empty.
        required: false
    outputs:
      page-url:
        description: URL returned by GitHub Pages deployment.
        value: ${{ jobs.deploy.outputs.page-url }}

permissions: {}

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate trusted deployment inputs
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
          NODE_VERSION: ${{ inputs.node-version }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          REGISTRY_SCOPE: ${{ inputs.registry-scope }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          SOURCE_REF: ${{ github.ref }}
          TRUSTED_REF: refs/heads/${{ github.event.repository.default_branch }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF" == "$TRUSTED_REF" ]] ||
            { echo "::error::production Pages deployment must run from the default branch"; exit 1; }
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "::error::package-manager must be npm or pnpm"; exit 1 ;;
          esac
          [[ "$NODE_VERSION" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] ||
            { echo "::error::node-version must be numeric"; exit 1; }
          [[ "$WORKING_DIRECTORY" == "." || "$WORKING_DIRECTORY" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] ||
            { echo "::error::working-directory must be workspace-relative"; exit 1; }
          [[ "$WORKING_DIRECTORY" != ".." && "$WORKING_DIRECTORY" != *"/../"* && "$WORKING_DIRECTORY" != "../"* && "$WORKING_DIRECTORY" != *"/.." ]] ||
            { echo "::error::working-directory must not traverse parent directories"; exit 1; }
          [[ "$OUTPUT_DIR" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ && "$OUTPUT_DIR" != "." ]] ||
            { echo "::error::output-dir must be a non-root relative path"; exit 1; }
          [[ "$OUTPUT_DIR" != ".." && "$OUTPUT_DIR" != *"/../"* && "$OUTPUT_DIR" != "../"* && "$OUTPUT_DIR" != *"/.." ]] ||
            { echo "::error::output-dir must not traverse parent directories"; exit 1; }
          [[ -n "$BUILD_COMMAND" && "$BUILD_COMMAND" != *$'\n'* && "$BUILD_COMMAND" != *$'\r'* ]] ||
            { echo "::error::build-command must be single-line trusted repository configuration"; exit 1; }
          if [[ -n "$REGISTRY_URL" ]]; then
            [[ "$REGISTRY_URL" =~ ^https://[^[:space:]@/]+(:[0-9]+)?(/[^[:space:]]*)?$ ]] ||
              { echo "::error::registry-url must be HTTPS, credential-free, and contain no whitespace"; exit 1; }
            [[ -n "$REGISTRY_SCOPE" ]] ||
              echo "::warning::registry-url without registry-scope replaces the default registry for every package"
          elif [[ -n "$REGISTRY_SCOPE" ]]; then
            echo "::error::registry-scope requires registry-url"
            exit 1
          fi
          if [[ -n "$REGISTRY_SCOPE" ]]; then
            [[ "$REGISTRY_SCOPE" =~ ^@?[a-z0-9][a-z0-9._-]*$ ]] ||
              { echo "::error::registry-scope must be a lowercase npm scope such as @jrmoulckers"; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.registry-scope }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build production site
        working-directory: ${{ inputs.working-directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash --noprofile --norc -eo pipefail -c "$BUILD_COMMAND"

      - name: Verify production output
        working-directory: ${{ inputs.working-directory }}
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          [[ -d "$OUTPUT_DIR" ]] ||
            { echo "::error::Pages output directory does not exist: $OUTPUT_DIR"; exit 1; }
          find "$OUTPUT_DIR" -mindepth 1 -print -quit | grep -q . ||
            { echo "::error::Pages output directory is empty: $OUTPUT_DIR"; exit 1; }
          if find "$OUTPUT_DIR" -type l -print -quit | grep -q .; then
            echo "::error::Pages output must not contain symbolic links"
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output-dir }}
          retention-days: 1

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
