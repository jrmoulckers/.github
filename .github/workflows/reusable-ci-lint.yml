# =============================================================================
# Reusable - Lint
# =============================================================================
#
# Framework-neutral lint and format checks. Command inputs are trusted repository
# configuration, not event data; they are transported through environment variables
# rather than interpolated into generated shell source.
#
# Optional private registry: set registry-url and registry-scope and pass the NODE_AUTH_TOKEN
# secret to install scoped packages from a private registry. actions/setup-node then writes a
# user-level npmrc to $RUNNER_TEMP/.npmrc and exports NPM_CONFIG_USERCONFIG; npm and pnpm both
# honour that file. A caller's own committed .npmrc is project-level and outranks it on every
# key it sets, so a repo .npmrc must not point the same scope at a different registry.
#
# The lint job requests packages: read. A caller with an explicit permissions block must grant
# packages: read too, or the run fails at startup.
#
# Example caller:
#   permissions:
#     contents: read
#     packages: read
#     pull-requests: read
#   jobs:
#     lint:
#       uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@<reviewed-commit-sha>
#       with:
#         package-manager: pnpm
#         lint-command: pnpm lint
#         format-check-command: pnpm format:check
#         registry-url: https://npm.pkg.github.com
#         registry-scope: '@jrmoulckers'
#       secrets:
#         NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
# =============================================================================
name: Reusable - Lint

on:
  workflow_call:
    inputs:
      node-version:
        description: Numeric Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Workspace-relative directory containing the manifest and lockfile.
        required: false
        type: string
        default: .
      lint-command:
        description: Trusted repository command for lint checks; empty skips the step.
        required: false
        type: string
        default: npm run lint
      format-check-command:
        description: Trusted repository command for format checks; empty skips the step.
        required: false
        type: string
        default: npm run format:check
      semantic-pr-title:
        description: Validate pull request titles against Conventional Commits.
        required: false
        type: boolean
        default: true
      registry-url:
        description: Optional HTTPS private registry to authenticate against; empty disables registry auth.
        required: false
        type: string
        default: ''
      registry-scope:
        description: Lowercase npm scope the private registry serves, such as @jrmoulckers.
        required: false
        type: string
        default: ''
    secrets:
      NODE_AUTH_TOKEN:
        description: Token used to authenticate against registry-url; unused when registry-url is empty.
        required: false

permissions: {}

jobs:
  lint:
    name: Lint and format
    if: inputs.lint-command != '' || inputs.format-check-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate inputs
        env:
          FORMAT_COMMAND: ${{ inputs.format-check-command }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          NODE_VERSION: ${{ inputs.node-version }}
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
          REGISTRY_SCOPE: ${{ inputs.registry-scope }}
          REGISTRY_URL: ${{ inputs.registry-url }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "::error::package-manager must be npm or pnpm"; exit 1 ;;
          esac
          [[ "$NODE_VERSION" =~ ^[0-9]+([.][0-9]+){0,2}$ ]] ||
            { echo "::error::node-version must be numeric"; exit 1; }
          [[ "$WORKING_DIRECTORY" == "." || "$WORKING_DIRECTORY" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] ||
            { echo "::error::working-directory must be a workspace-relative path"; exit 1; }
          [[ "$WORKING_DIRECTORY" != ".." && "$WORKING_DIRECTORY" != *"/../"* && "$WORKING_DIRECTORY" != "../"* && "$WORKING_DIRECTORY" != *"/.." ]] ||
            { echo "::error::working-directory must not traverse parent directories"; exit 1; }
          for command in "$LINT_COMMAND" "$FORMAT_COMMAND"; do
            [[ "$command" != *$'\n'* && "$command" != *$'\r'* ]] ||
              { echo "::error::commands must be single-line trusted repository configuration"; exit 1; }
          done
          if [[ -n "$REGISTRY_URL" ]]; then
            [[ "$REGISTRY_URL" =~ ^https://[^[:space:]@/]+(:[0-9]+)?(/[^[:space:]]*)?$ ]] ||
              { echo "::error::registry-url must be HTTPS, credential-free, and contain no whitespace"; exit 1; }
            [[ -n "$REGISTRY_SCOPE" ]] ||
              echo "::warning::registry-url without registry-scope replaces the default registry for every package"
          elif [[ -n "$REGISTRY_SCOPE" ]]; then
            echo "::error::registry-scope requires registry-url"
            exit 1
          fi
          if [[ -n "$REGISTRY_SCOPE" ]]; then
            [[ "$REGISTRY_SCOPE" =~ ^@?[a-z0-9][a-z0-9._-]*$ ]] ||
              { echo "::error::registry-scope must be a lowercase npm scope such as @jrmoulckers"; exit 1; }
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.registry-scope }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Run lint
        if: inputs.lint-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          CHECK_COMMAND: ${{ inputs.lint-command }}
        run: bash --noprofile --norc -eo pipefail -c "$CHECK_COMMAND"

      - name: Check formatting
        if: inputs.format-check-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          CHECK_COMMAND: ${{ inputs.format-check-command }}
        run: bash --noprofile --norc -eo pipefail -c "$CHECK_COMMAND"

  pr-title:
    name: Semantic PR title
    if: inputs.semantic-pr-title && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false
