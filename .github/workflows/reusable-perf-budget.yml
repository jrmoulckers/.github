# =============================================================================
# Reusable — Performance Budget
# =============================================================================
#
# Generic web performance budget workflow. It builds the caller's app, enforces a
# bundle-size budget, and optionally runs Lighthouse CI against a supplied URL.
#
# Example caller:
#   jobs:
#     perf:
#       uses: jrmoulckers/.github/.github/workflows/reusable-perf-budget.yml@main
#       with:
#         package-manager: pnpm
#         output-dir: dist
#         bundle-budget-kb: 2048
# =============================================================================
name: Reusable — Performance Budget

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use.
        required: false
        type: string
        default: '22'
      package-manager:
        description: Package manager to use (npm or pnpm).
        required: false
        type: string
        default: npm
      working-directory:
        description: Directory containing the package manifest and lockfile.
        required: false
        type: string
        default: .
      build-command:
        description: Command that builds the web app.
        required: false
        type: string
        default: npm run build
      output-dir:
        description: Build output directory, relative to working-directory.
        required: false
        type: string
        default: dist
      bundle-budget-kb:
        description: Maximum built output directory size in KB.
        required: false
        type: number
        default: 2048
      url:
        description: Optional URL or preview URL for Lighthouse CI.
        required: false
        type: string
        default: ''
      lhci-min-performance:
        description: Minimum Lighthouse performance score.
        required: false
        type: number
        default: 90
      lhci-min-accessibility:
        description: Minimum Lighthouse accessibility score.
        required: false
        type: number
        default: 95

permissions:
  contents: read

jobs:
  performance:
    name: Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate package manager
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "::error::package-manager must be 'npm' or 'pnpm'"
              exit 1
              ;;
          esac

      - name: Enable Corepack for pnpm cache
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/npm-shrinkwrap.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Enable Corepack
        if: inputs.package-manager == 'pnpm'
        run: corepack enable

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: inputs.package-manager == 'pnpm'
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      - name: Bundle size budget
        working-directory: ${{ inputs.working-directory }}
        run: |
          OUTPUT_DIR="${{ inputs.output-dir }}"
          BUDGET_KB="${{ inputs.bundle-budget-kb }}"

          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "::error::Output directory '$OUTPUT_DIR' does not exist"
            exit 1
          fi

          SIZE_KB=$(du -sk "$OUTPUT_DIR" | cut -f1)

          echo "### 📦 Bundle Size Budget" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Output directory | \`$OUTPUT_DIR\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actual size | ${SIZE_KB} KB |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Budget | ${BUDGET_KB} KB |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Bundle size ${SIZE_KB}KB exceeds budget ${BUDGET_KB}KB"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**❌ Bundle exceeds budget.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**✅ Bundle is within budget.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Write Lighthouse CI config
        if: inputs.url != ''
        working-directory: ${{ inputs.working-directory }}
        run: |
          PERFORMANCE_SCORE=$(awk "BEGIN { printf \"%.2f\", ${{ inputs.lhci-min-performance }} / 100 }")
          ACCESSIBILITY_SCORE=$(awk "BEGIN { printf \"%.2f\", ${{ inputs.lhci-min-accessibility }} / 100 }")

          cat > .lighthouserc.json <<JSON
          {
            "ci": {
              "collect": {
                "url": ["${{ inputs.url }}"],
                "numberOfRuns": 1
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["error", { "minScore": $PERFORMANCE_SCORE }],
                  "categories:accessibility": ["error", { "minScore": $ACCESSIBILITY_SCORE }]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          JSON

      - name: Lighthouse CI
        if: inputs.url != ''
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12.6.2
        with:
          urls: ${{ inputs.url }}
          configPath: ${{ inputs.working-directory }}/.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Lighthouse skipped
        if: inputs.url == ''
        run: |
          echo "### 🔦 Lighthouse CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped because no \`url\` input was provided." >> "$GITHUB_STEP_SUMMARY"
